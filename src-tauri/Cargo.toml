[package]
name = "world-keeper"
version = "0.1.0"
description = "A desktop manager for a Core Keeper dedicated server's worlds, over SSH"
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "world_keeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
russh = "0.62.4"
russh-sftp = "2.3.0"
keyring = { version = "4.1.5", features = ["v1"] }
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
zip = "8.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
async-trait = "0.1"
tauri-plugin-dialog = "2.7.2"
sha2 = "0.11.0"
tauri-plugin-clipboard-manager = "2.3.2"
csv = "1.4.0"

